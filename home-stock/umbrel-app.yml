manifestVersion: 1
id: home-stock
category: files
name: Home Stock
version: "0.11.0"
tagline: Houd je voorraad, houdbaarheid en boodschappen overzichtelijk bij
description: >-
  Home Stock is een uitgebreide, volledig zelfgehoste voorraadassistent voor thuis.
  Beheer losse voorraadpartijen in de koelkast, vriezer, voorraadkast of eigen
  locaties. Scan winkelbarcodes, laat producten invullen via Open Food Facts en
  bepaal automatisch een aanpasbare houdbaarheidsdatum met lokale regels en
  optioneel Gemini Free Tier.


  Labels worden bij het toevoegen direct als controleerbaar voorbeeld gemaakt.
  Een DYMO LabelWriter 400 of 450 die via USB op de Umbrel-server is aangesloten
  wordt automatisch herkend en kan labels rechtstreeks printen. Browserprinten
  blijft beschikbaar als reserveoptie.
releaseNotes: >-
  v0.11.0 voegt locatiekaarten, sorteermogelijkheden, volledige bewerking van
  losse bakken, veilig productarchief, bewerkbare recepten, slimme
  maaltijdboodschappen en uitgebreider gebruikersbeheer toe. De scanner is
  beschermd tegen dubbele scans en afgevinkte boodschappen zijn gezamenlijk
  op te ruimen.
  v0.10.0 voegt direct verbruiken via de scanner, terugdraaibare voorraadacties,
  opruimen van verlopen partijen, filters, houdbaarheidssjablonen, instelbare
  meldingstijden en verder verbeterde mobiele weergaven toe.
  v0.9.0 vernieuwt de volledige interface met een nieuw dashboard, modernere
  voorraadkaarten, rustigere formulieren en modals, een aparte mobiele
  ondernavigatie, grotere aanraakvlakken voor iPhone en een lichte en donkere
  modus. Product toevoegen en barcode scannen zijn direct vanaf het dashboard
  bereikbaar. Ook de login en het gebruikersbeheer hebben dezelfde nieuwe stijl.
  v0.8.0 voegt het gewicht per bak of verpakking toe. Gemini gebruikt het aantal
  gram samen met de naam en ingrediënten om een specifieke bereidingswijze met
  tijd en temperatuur of wattage te maken. Het gewicht verschijnt ook op het
  voorraadscherm en DYMO-label. Daarnaast kan een product na het verbruiken of
  verspillen van de laatste voorraad
  uit de actieve lijst halen zonder historie of statistieken te wissen. Een nieuwe
  partij activeert het product opnieuw.
  v0.7.0 voegt een bereidingswijze toe aan het DYMO 99014-label. Gemini maakt
  een korte instructie op basis van zowel de naam als de ingrediënten. De tekst
  is controleerbaar, handmatig aanpasbaar en wordt per product opgeslagen.
  v0.6.1 schakelt de extra Umbrel-proxylogin uit. Home Stock opent daardoor
  rechtstreeks zijn eigen beveiligde loginpagina. De README is opnieuw
  ingedeeld en de standaard inloggegevens worden nu in Umbrel getoond.
  v0.6.0 maakt Home Stock installeerbaar als iPhone-webapp met Apple-appicoon,
  standalone weergave, mobiele navigatie en een iOS-geschikte camerascanner.
  Barcodes worden volledig lokaal op de Home Stock-server herkend; via HTTP is
  Foto scannen beschikbaar en via HTTPS werkt ook continu live scannen.
  v0.5.0 voegt meerdere bakken of verpakkingen tegelijk toe als losse
  voorraadpartijen. Iedere bak krijgt een eigen code en barcode, zoals VP001-A,
  VP001-B en VP001-C, kan individueel worden verbruikt en krijgt desgewenst een
  eigen label dat samen met de andere labels direct kan worden geprint.
  v0.4.0 vernieuwt het DYMO 99014-label als verticaal bewaaretiket met een
  vaste korte artikelcode, inhoud, locatie, productie- of bereidingsdatum,
  einddatum, hoeveelheid, partij en de persoon die het product heeft ingelegd.
  v0.3.0 voegt automatische USB-detectie, een ingebouwde CUPS-printerservice,
  direct printen, een standaardprinter en een testlabel toe voor de DYMO
  LabelWriter 400- en 450-serie.
  v0.2.2 voegt verplichte login, wachtwoordwijziging bij eerste gebruik,
  gebruikersbeheer, beheerdersrechten en beveiligde sessies toe.
  v0.2.1 vervangt browserpop-ups door formulieren met dropdowns, aantallen,
  locatiekeuze en foutmeldingen binnen de app.
  Volledig vernieuwde v0.2 met voorraadpartijen, vaste en eigen locaties,
  Open Food Facts, Gemini-houdbaarheidsinschatting, prijzen, winkels,
  verbruik- en verspillingstatistieken, huishoudprofielen, geschiedenis,
  meldingen, recepten, maaltijdplanning en een DYMO-labelwachtrij.

