manifestVersion: 1
id: home-stock
category: files
name: Home Stock
version: "0.4.0"
tagline: Houd je voorraad, houdbaarheid en boodschappen overzichtelijk bij
description: >-
  Home Stock is een uitgebreide, volledig zelfgehoste voorraadassistent voor thuis.
  Beheer losse voorraadpartijen in de koelkast, vriezer, voorraadkast of eigen
  locaties. Scan winkelbarcodes, laat producten invullen via Open Food Facts en
  bepaal automatisch een aanpasbare houdbaarheidsdatum met lokale regels en
  optioneel Gemini Free Tier.


  Labels worden bij het toevoegen direct als controleerbaar voorbeeld gemaakt.
  Een DYMO LabelWriter 400 of 450 die via USB op de Umbrel-server is aangesloten
  wordt automatisch herkend en kan labels rechtstreeks printen. Browserprinten
  blijft beschikbaar als reserveoptie.
releaseNotes: >-
  v0.4.0 vernieuwt het DYMO 99014-label als verticaal bewaaretiket met een
  vaste korte artikelcode, inhoud, locatie, productie- of bereidingsdatum,
  einddatum, hoeveelheid, partij en de persoon die het product heeft ingelegd.
  v0.3.0 voegt automatische USB-detectie, een ingebouwde CUPS-printerservice,
  direct printen, een standaardprinter en een testlabel toe voor de DYMO
  LabelWriter 400- en 450-serie.
  v0.2.2 voegt verplichte login, wachtwoordwijziging bij eerste gebruik,
  gebruikersbeheer, beheerdersrechten en beveiligde sessies toe.
  v0.2.1 vervangt browserpop-ups door formulieren met dropdowns, aantallen,
  locatiekeuze en foutmeldingen binnen de app.
  Volledig vernieuwde v0.2 met voorraadpartijen, vaste en eigen locaties,
  Open Food Facts, Gemini-houdbaarheidsinschatting, prijzen, winkels,
  verbruik- en verspillingstatistieken, huishoudprofielen, geschiedenis,
  meldingen, recepten, maaltijdplanning en een DYMO-labelwachtrij.

